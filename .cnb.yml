main:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
      imports: https://cnb.cool/liyao52033/envs/-/blob/main/private.yml
      stages: 

        - name: pull-and-merge-private-repo
          image: alpine/git
          script: |
            echo "📥 拉取私有仓库代码到临时分支"
            PRIVATE_REPO_URL="https://cnb:${PRIVATE_REPO_TOKEN}@cnb.cool/liyao52033/privatemd.git"
            TEMP_BRANCH="temp-private-merge"
            
            # 拉取私有仓库到临时分支
            git fetch "${PRIVATE_REPO_URL}" main:${TEMP_BRANCH} || { echo "❌ 拉取私有仓库失败"; exit 1; }
            
            echo "🔀 合并临时分支到当前分支"
            git merge ${TEMP_BRANCH} --no-edit || {
              echo "⚠️ 合并出现冲突，尝试自动解决"
              git merge --abort
              git merge -X theirs ${TEMP_BRANCH} --no-edit || { echo "❌ 合并冲突无法自动解决"; exit 1; }
            }
            
            echo "✅ 私有仓库代码合并完成"
       

        - name: install-dependencies
          script: |
            echo "Installing dependencies..."
            yarn
            echo "✅ 依赖安装完成"
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script: |
            export HUGO_PARAMS_DOCSEARCH_APPID=$HUGO_PARAMS_DOCSEARCH_APPID
            export HUGO_PARAMS_DOCSEARCH_APIKEY=$HUGO_PARAMS_DOCSEARCH_APIKEY
            export HUGO_PARAMS_DOCSEARCH_INDEXNAME=$HUGO_PARAMS_DOCSEARCH_INDEXNAME
            export HUGO_PARAMS_DOCSEARCH_ASKAI_INDEXNAME=$HUGO_PARAMS_DOCSEARCH_ASKAI_INDEXNAME
            export HUGO_PARAMS_DOCSEARCH_ASKAI_ASSISTANTID=$HUGO_PARAMS_DOCSEARCH_ASKAI_ASSISTANTID
            export HUGO_PARAMS_FOOTER_ICP=$HUGO_PARAMS_FOOTER_ICP
            node scripts/add-frontmatter.js
            yarn run build:log
        - name: deploy-to-edgeone-pages
          imports:  https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          script: |
            echo "Deploying to EdgeOne Pages..."
            edgeone pages deploy ./dist -n vuepress-vdoing -t $EDGEONE_PAGES_API_TOKEN
        - name: prepare bg branch
          image: alpine/git
          commands:
            - git fetch origin main
            - git checkout -b bg origin/main
        - name: sync-to-github
          image: tencentcom/git-sync
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/github-env.yml
          settings:
            target_url: https://github.com/liyao52033/hugopress.git
            branch: bg
            git_user: ${GIT_USERNAME}
            git_email: ${GIT_EMAIL}
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

include:
    - https://cnb.cool/liyao52033/build-template/-/blob/main/.cnb/vscode.yml
    - https://cnb.cool/liyao52033/build-template/-/blob/main/template/codewiki.yml