main:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
      imports: https://cnb.cool/liyao52033/envs/-/blob/main/private.yml
      stages: 

        - name: pull-and-merge-private-repo
          image: alpine/git
          script: |
            set -e  # 开启严格模式，任何命令失败立即退出
            echo "=============== 环境检查 ==============="
            # 1. 检查当前Git仓库状态（关键：确认工作目录是Git仓库）
            echo "📌 当前工作目录：$(pwd)"
            echo "📌 Git仓库状态："
            git status
            echo "📌 本地分支列表："
            git branch -a
            
            echo "=============== 配置Git ==============="
            git config --global user.name "cnb.bMRqLGnLAEA"
            git config --global user.email "liyao52033@163.com"
            
            echo "=============== 拉取私有仓库 ==============="
            PRIVATE_REPO_URL="https://cnb:${PRIVATE_REPO_TOKEN}@cnb.cool/liyao52033/privatemd"
            TEMP_BRANCH="temp-private-merge"
            
            # 强制删除旧临时分支（避免残留）
            git branch -D ${TEMP_BRANCH} || true
            
            # 拉取私有仓库指定分支（明确指定拉取main分支）
            echo "📥 拉取私有仓库：${PRIVATE_REPO_URL} main -> ${TEMP_BRANCH}"
            git fetch "${PRIVATE_REPO_URL}" main:${TEMP_BRANCH}
            # 验证拉取结果：检查临时分支是否存在，且有提交记录
            if ! git rev-parse --verify ${TEMP_BRANCH} >/dev/null 2>&1; then
              echo "❌ 临时分支${TEMP_BRANCH}拉取失败！"
              git fetch --verbose "${PRIVATE_REPO_URL}"  # 输出详细拉取日志
              exit 1
            fi
            
            echo "=============== 验证私有仓库内容 ==============="
            # 关键：查看私有仓库临时分支的文件列表（确认拉取到了文件）
            echo "📂 私有仓库${TEMP_BRANCH}分支文件列表："
            git ls-tree -r ${TEMP_BRANCH} --name-only
            
            echo "=============== 执行合并 ==============="
            # 切换到当前工作分支（确保合并到正确分支）
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "🔀 合并${TEMP_BRANCH}到当前分支${CURRENT_BRANCH}"
            # 使用--allow-unrelated-histories：解决两个仓库无共同提交的问题（常见坑）
            git merge ${TEMP_BRANCH} --no-edit --allow-unrelated-histories || {
              echo "⚠️ 合并冲突，尝试用私有仓库文件覆盖当前文件"
              git merge --abort
              # 直接检出私有仓库的所有文件到当前分支（强制覆盖，无冲突）
              git checkout ${TEMP_BRANCH} -- .
              git add .
              git commit -m "Merge private repo files (force overwrite)" --no-edit
            }
            
            echo "=============== 合并后验证 ==============="
            ls -la content/04.开源项目/20.hugo开发
            echo "✅ 私有仓库合并流程完成"
       

        - name: install-dependencies
          script: |
            echo "Installing dependencies..."
            yarn
            echo "✅ 依赖安装完成"
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script: |
            export HUGO_PARAMS_DOCSEARCH_APPID=$HUGO_PARAMS_DOCSEARCH_APPID
            export HUGO_PARAMS_DOCSEARCH_APIKEY=$HUGO_PARAMS_DOCSEARCH_APIKEY
            export HUGO_PARAMS_DOCSEARCH_INDEXNAME=$HUGO_PARAMS_DOCSEARCH_INDEXNAME
            export HUGO_PARAMS_DOCSEARCH_ASKAI_INDEXNAME=$HUGO_PARAMS_DOCSEARCH_ASKAI_INDEXNAME
            export HUGO_PARAMS_DOCSEARCH_ASKAI_ASSISTANTID=$HUGO_PARAMS_DOCSEARCH_ASKAI_ASSISTANTID
            export HUGO_PARAMS_FOOTER_ICP=$HUGO_PARAMS_FOOTER_ICP
            node scripts/add-frontmatter.js
            yarn run build:log
        - name: deploy-to-edgeone-pages
          imports:  https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          script: |
            echo "Deploying to EdgeOne Pages..."
            edgeone pages deploy ./dist -n vuepress-vdoing -t $EDGEONE_PAGES_API_TOKEN
        - name: prepare bg branch
          image: alpine/git
          commands:
            - git fetch origin main
            - git checkout -b bg origin/main
        - name: sync-to-github
          image: tencentcom/git-sync
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/github-env.yml
          settings:
            target_url: https://github.com/liyao52033/hugopress.git
            branch: bg
            git_user: ${GIT_USERNAME}
            git_email: ${GIT_EMAIL}
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

include:
    - https://cnb.cool/liyao52033/build-template/-/blob/main/.cnb/vscode.yml
    - https://cnb.cool/liyao52033/build-template/-/blob/main/template/codewiki.yml