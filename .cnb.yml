$:
  push:
    - name: hugo deploy
      stages: 
        - name: install-dependencies
          image: docker.cnb.cool/znb/images/node:22
          script: |
            echo "Installing dependencies..."
            npm install
        - name: build
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          image: docker.cnb.cool/liyao52033/images/debian:latest
          script: |
            echo "Building..."
            npm run build:prod
        - name: deploy-to-edgeone-pages
          imports:  https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          image: tencentcom/deploy-eopages:latest
          script: |
            echo "Deploying to EdgeOne Pages..."
            edgeone pages deploy ./dist -n vuepress-vdoing -t $EDGEONE_PAGES_API_TOKEN

include:
    - https://cnb.cool/liyao52033/build-template/-/blob/main/.cnb/vscode.yml
    - https://cnb.cool/liyao52033/build-template/-/blob/main/template/codewiki.yml

      