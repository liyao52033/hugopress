main:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
      stages: 
        - name: add private repo remote
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/private.yml
          script: |
            git remote add private_repo https://cnb:${PRIVATE_REPO_TOKEN}@cnb.cool/liyao52033/privatemd
            git fetch private_repo main
            git log -1 --oneline 
            ls -la

        - name: merge private repo into current
          script: |
            git checkout main
            git pull origin main
            git merge private_repo/main --no-ff --no-commit

            conflict_files=$(git diff --name-only --diff-filter=U)
            if [ -n "$conflict_files" ]; then
              for file in $conflict_files; do
                git checkout --ours -- "$file" && git add "$file"
              done
            fi

            # 确保有变更时才提交
            if ! git diff --cached --quiet; then
              git commit -m "Merge private_repo/main: resolve all conflicts with pipeline repo (main) as source of truth"
            else
              echo "No staged changes to commit after merge"
            fi
              

        - name: commit with temp branch via git-commit
          image: tencentcom/git-commit:latest
          settings:
            commitMessage: "Merge private_repo/main: resolve all conflicts with pipeline repo (main) as source of truth"
            add: ["content/"]   # 把所有已暂存的变更加入提交
          exports:
            branch: COMMIT_BRANCH   # 导出临时分支名供后续步骤使用

        - name: show merged result
          script: |
            git log -1 --oneline 
            echo $COMMIT_BRANCH
            ls -la content/04.开源项目/20.hugo开发

        - name: install-dependencies
          script: |
            echo "Installing dependencies..."
            yarn
            echo "✅ 依赖安装完成"
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script: |
            export HUGO_PARAMS_DOCSEARCH_APPID=$HUGO_PARAMS_DOCSEARCH_APPID
            export HUGO_PARAMS_DOCSEARCH_APIKEY=$HUGO_PARAMS_DOCSEARCH_APIKEY
            export HUGO_PARAMS_DOCSEARCH_INDEXNAME=$HUGO_PARAMS_DOCSEARCH_INDEXNAME
            export HUGO_PARAMS_DOCSEARCH_ASKAI_INDEXNAME=$HUGO_PARAMS_DOCSEARCH_ASKAI_INDEXNAME
            export HUGO_PARAMS_DOCSEARCH_ASKAI_ASSISTANTID=$HUGO_PARAMS_DOCSEARCH_ASKAI_ASSISTANTID
            export HUGO_PARAMS_FOOTER_ICP=$HUGO_PARAMS_FOOTER_ICP
            node scripts/add-frontmatter.js
            yarn run build:log
        - name: deploy-to-edgeone-pages
          imports:  https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          script: |
            echo "Deploying to EdgeOne Pages..."
            edgeone pages deploy ./dist -n vuepress-vdoing -t $EDGEONE_PAGES_API_TOKEN
        - name: prepare bg branch
          image: alpine/git
          commands:
            - git fetch origin main
            - git checkout -b bg origin/main
        - name: sync-to-github
          image: tencentcom/git-sync
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/github-env.yml
          settings:
            target_url: https://github.com/liyao52033/hugopress.git
            branch: bg
            git_user: ${GIT_USERNAME}
            git_email: ${GIT_EMAIL}
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}

include:
    - https://cnb.cool/liyao52033/build-template/-/blob/main/.cnb/vscode.yml
    - https://cnb.cool/liyao52033/build-template/-/blob/main/template/codewiki.yml