$:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
        volumes:
          - ./node_modules:copy-on-write
      stages: 
        - name: check-dependencies
          script: |
            echo "检查依赖状态..."
            if [ ! -d "node_modules" ] || [ ! -f "node_modules/.install_complete" ] || [ package.json -nt node_modules/.install_complete ]; then
              echo "需要安装或更新依赖"
              echo "NEED_INSTALL=true" > build_status.env
            else
              echo "依赖已存在且最新"
              echo "NEED_INSTALL=false" > build_status.env
            fi
          exports:
            NEED_INSTALL: STATUS
        - name: install-dependencies
          if: '[ "$STATUS" = "true" ]'
          script: |
            echo "Installing dependencies..."
            yarn install
            touch node_modules/.install_complete
            echo "✅ 依赖安装完成"
        - name: skip-install-message
          if: '[ "$STATUS" = "false" ]'
          script: |
            echo "⚡ 使用缓存的依赖，跳过安装步骤"
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script: |
            yarn run build:prod
        - name: deploy-to-edgeone-pages
          imports:  https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          script: |
            echo "Deploying to EdgeOne Pages..."
            edgeone pages deploy ./dist -n vuepress-vdoing -t $EDGEONE_PAGES_API_TOKEN
        # - name: prepare bg branch
        #   image: alpine/git
