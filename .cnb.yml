main:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
        volumes:
          - .node_modules
          - .resources
      stages: 
        - name: install-dependencies
          script: |
            echo "Installing dependencies..."
            yarn install
            echo "✅ 依赖安装完成"
        - name: optimize-hugo-modules
          script: |
            echo "优化Hugo模块下载..."
            # 设置Hugo模块代理加速下载
            export GOPROXY=https://mirrors.cloud.tencent.com/go/
            export HUGO_DISABLE_ALTERNATIVE_RESOLVER=true
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script: |
            hugo --gc --minify -D -F
