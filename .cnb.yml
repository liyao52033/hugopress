$:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
      stages: 
        - name: install-dependencies
          script: |
            echo "Installing dependencies..."
            npm install
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script:
            - echo "正在运行 Hugo 构建..."
            - npm run build:prod
            - echo "✅ 打包完成"
          # environment:
          #   HUGO_ENVIRONMENT: production      
          # script:
          #   - echo "正在运行 Hugo 构建..."
          #   - npm run build
          #   - echo "✅ 打包完成"
        - name: deploy-to-edgeone-pages
          imports:  https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          script: |
            echo "Deploying to EdgeOne Pages..."
            edgeone pages deploy ./dist -n vuepress-vdoing -t $EDGEONE_PAGES_API_TOKEN
        - name: sync-to-github
          image: tencentcom/git-sync
          settings:
            imports: https://cnb.cool/liyao52033/envs/-/blob/main/github-env.yml
            target_url: https://github.com/liyao52033/hugopress.git
            auth_type: https
            username: $GIT_USERNAME   
            password: $GIT_ACCESS_TOKEN

include:
    - https://cnb.cool/liyao52033/build-template/-/blob/main/.cnb/vscode.yml
    - https://cnb.cool/liyao52033/build-template/-/blob/main/template/codewiki.yml

      