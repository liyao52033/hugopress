main:
  push:
    - docker: 
        image: docker.cnb.cool/liyao52033/images/hugo-eo:latest
      stages: 
        - name: install-dependencies
          script: |
            echo "Installing dependencies..."
            yarn install
        - name: build with hugo
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/hugo-env.yml
          script:
            echo "正在运行 Hugo 构建..."
            hugo --gc --minify -D -F --environment production 
            echo "✅ 打包完成"
