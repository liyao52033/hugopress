<div class="weather-card">
    <div class="weather-header">
        <h3 class="weather-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19c0-1.7-1.3-3-3-3h-11c-1.7 0-3 1.3-3 3s1.3 3 3 3h11c1.7 0 3-1.3 3-3z"/>
                <path d="M12 16V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v12"/>
                <path d="M17.5 19c0-3-2.5-5-5.5-5"/>
                <path d="M14 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            </svg>
            天气信息
        </h3>
        <div class="weather-header-right">
            <div class="weather-location" id="weather-location">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span id="location-text">加载中...</span>
            </div>
            <button class="weather-refresh-btn" id="weather-refresh-btn" title="刷新天气">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 21h5v-5"/>
                </svg>
            </button>
        </div>
    </div>
    
    <div class="weather-content">
        <div class="weather-main">
            <div class="weather-icon-wrapper">
                <div class="weather-icon-bg" id="weather-icon-bg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2"/>
                        <path d="M12 20v2"/>
                        <path d="M4.93 4.93l1.41 1.41"/>
                        <path d="M17.66 17.66l1.41 1.41"/>
                        <path d="M2 12h2"/>
                        <path d="M20 12h2"/>
                        <path d="M6.34 17.66l-1.41 1.41"/>
                        <path d="M19.07 4.93l-1.41 1.41"/>
                    </svg>
                </div>
            </div>
            <div class="weather-info">
                <div class="weather-temp" id="weather-temp">--°C</div>
                <div class="weather-desc" id="weather-desc">--</div>
                <div class="weather-update" id="weather-update">更新时间：--</div>
            </div>
        </div>
        
        <div class="weather-details">
            <div class="weather-detail-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
                </svg>
                <span class="detail-label">风向:</span>
                <span class="detail-value" id="wind-direction">--</span>
            </div>
            <div class="weather-detail-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
                <span class="detail-label">风力:</span>
                <span class="detail-value" id="wind-power">--</span>
            </div>
            <div class="weather-detail-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
                <span class="detail-label">湿度:</span>
                <span class="detail-value" id="humidity">--%</span>
            </div>
            <div class="weather-detail-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v2"/>
                    <circle cx="12" cy="12" r="10"/>
                </svg>
                <span class="detail-label">气压:</span>
                <span class="detail-value" id="air-pressure">--hPa</span>
            </div>
        </div>
        
        <div class="weather-alarms" id="weather-alarms">
            <div class="alarms-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                <span>预警信息</span>
            </div>
            <div class="alarms-list" id="alarms-list">
                <div class="alarm-item">
                    <div class="alarm-title" id="alarm-title"></div>
                    <div class="alarm-content" id="alarm-content"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="weather-loading" id="weather-loading">
        <div class="loading-spinner"></div>
        <span>正在获取天气信息...</span>
    </div>
    
    <div class="weather-error" id="weather-error" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-message">获取失败</span>
    </div>
</div>
