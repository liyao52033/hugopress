<div id="tcomment"></div>

<script>
    (function () {
      function initTwikoo() {
        try {
          if (document.getElementById('tcomment') && window.twikoo) {
            twikoo.init({
              el: '#tcomment',
              envId: '{{ .Site.Params.twikoo.envId }}',
              lang: '{{- .Site.LanguageCode -}}',
            });
            return true;
          }
        } catch (e) {
          if (window.console && console.debug) console.debug('twikoo init error:', e);
        }
        return false;
      }

      // 监听第三方库加载完成事件
      window.addEventListener('thirdPartyLoaded', function() {
        initTwikoo();
      }, { once: true });
  
      // 备用：DOMContentLoaded 时尝试初始化（如果库已加载）
      window.addEventListener('DOMContentLoaded', function () {
        initTwikoo();
      }, { once: true });
    })();
  </script>

  <style>
    .twikoo {
       margin: 2rem 0 .5rem 0;
    }
</style>
