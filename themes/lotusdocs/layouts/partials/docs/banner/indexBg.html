<div class="index-bigimg" style="display: none"></div>

<div class="banner-conent">
  <header class="hero">
    <img src="img/logo.png" alt="logo" style="width: 200px;"> 
    <h1 id="main-title">{{.Site.Title}}</h1> 
    <p class="description"><span>{{.Site.Params.indexImg.desc}}</span><span class="typed" style="animation: auto ease 0s 1 normal none running none;"></span></p> 
  </header> 
</div>


<!-- 样式部分 -->
<style>
  /* 图片大小 + 背景图核心样式 */
  .banner {
    margin-top: 0 !important;
    height: 100vh;
    background-attachment: fixed !important;
    position: relative;
    overflow: hidden;
    /* 背景图基础样式 */
    background-size: cover;    
    background-position: center;
    background-repeat: no-repeat;
  }

  /* 图片中间的签名和标题位置 */
  .banner-conent {
    margin-top: 23vh !important;
    text-align: center;
    color: #fff;
    z-index: 10;
    position: relative;
  }

  /* 导航栏透明样式 */
  .navbar1 {
    background-color: transparent !important;
    box-shadow: none;
    backdrop-filter: none !important;
    border: none !important;
  }

  .nav-link1 {
    color: hsl(207, 100%, 88%) !important;
  }
  
  .navbar-nav1 .dropdown-title a:hover,
  .navbar-nav1 .title,
  .navbar-nav1 .dropdown-title>.link-title,
  .site-name1 {
    color: #9698c3;  
  }

  /* 箭头样式 */
  .banner-arrow {
    display: block;
    margin: 12rem auto 0;
    bottom: 45px;
    width: 20px;
    height: 20px;
    font-size: 34px;
    text-align: center;
    animation: bounce-in 5s 3s infinite;
    position: absolute;
    left: 50%;
    bottom: 15%;
    margin-left: -10px;
    cursor: pointer;
    z-index: 999;
  }

  @keyframes bounce-in {
    0% { transform: translateY(0); }
    20% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
    80% { transform: translateY(0); }
    to { transform: translateY(0); }
  }

  .banner-arrow::before {
    content: "";
    width: 20px;
    height: 20px;
    display: block;
    border-right: 3px solid #fff;
    border-top: 3px solid #fff;
    transform: rotate(135deg);
    position: absolute;
    bottom: 10px;
  }

  .banner-arrow::after {
    content: "";
    width: 20px;
    height: 20px;
    display: block;
    border-right: 3px solid #fff;
    border-top: 3px solid #fff;
    transform: rotate(135deg);
  }

  #main-title {
    font-size: clamp(3rem, 8vw, 5.5rem);
    font-weight: 700;
    margin-bottom: 1.5rem;
    letter-spacing: 1px;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 0 30px rgba(147, 51, 234, .6), 0 0 60px rgba(6, 182, 212, .4), 0 4px 20px rgba(0, 0, 0, .5);
    filter: brightness(1.1);
  }

  /* 描述文字样式 */
  .description {
    display: inline-block;
    font-size: '{{ .Site.Params.indexImg.descFontSize | default "1.4rem" }}';
    background: rgba(59, 130, 246, 3%);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(31, 135, 248, 3%), 0 4px 16px rgba(59, 130, 246, 5%), inset 0 1px rgba(255, 255, 255, .1), inset 0 -1px rgba(59, 130, 246, 8%);
    border: 1px solid rgba(147, 197, 253, .1);
    border-radius: 50px;
    padding: 10px 20px;
    width: fit-content;

  }

  .typed {
    opacity: 1;
  }

  /* 时间背景色（叠加在图片上） */
  .banner-color {
    width: 100%;
    min-height: 450px;
    overflow: hidden;
    margin-top: 0;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* 气泡画布 */
  #canvas {
    position: absolute;
    top: '{{ .Site.Params.indexImg.bubblePosition | default 0 }}%';
    left: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* 提示框样式 */
  .global-tip {
    position: fixed;
    display: flex;
    top: -10px;
    left: 50%;
    opacity: 0;
    min-width: 320px;
    transform: translateX(-50%);
    transition: opacity 0.3s linear, top 0.4s, transform 0.4s;
    z-index: 99999;
    padding: 15px 15px 15px 20px;
    border: 1px solid #ebeef5;
    border-radius: 4px;
    grid-row: 1;
    line-height: 17px;
  }

  .global-tip p {
    line-height: 17px;
    margin: 0;
    font-size: 14px;
  }

  .icon {
    margin-right: 10px;
    line-height: 17px;
  }

  .tip-success {
    color: #67c23a;
    background-color: #f0f9eb;
    border-color: #e1f3d8;
  }

  .tip-success .tip-success-content {
    color: #67c23a;
  }

  .tip-danger {
    color: #f56c6c;
    background-color: #fef0f0;
    border-color: #fde2e2;
  }

  .tip-danger .tip-danger-content {
    color: #f56c6c;
  }

  .tip-info {
    background-color: #edf2fc;
    border-color: #ebeef5;
  }

  .tip-info .tip-info-content {
    color: #909399;
  }

  .tip-warning {
    color: #e6a23c;
    background-color: #fdf6ec;
    border-color: #faecd8;
  }

  .tip-warning .tip-warning-content {
    margin: 0;
    color: #e6a23c;
    line-height: 21px;
    font-size: 14px;
  }

  @keyframes typedBlink {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>

<!-- JavaScript 逻辑（所有模板语法加引号） -->
<script>
  // 从 Hugo 配置中读取参数（所有模板语法包裹引号，并按需转换类型）
  const config = {
    navColor: Number('{{ .Site.Params.indexImg.navColor | default 2 }}'),
    switchNavColor: '{{ .Site.Params.indexImg.switchNavColor | default false }}' === 'true',
    bgTimeColor: '{{ .Site.Params.indexImg.bgTimeColor | default false }}' === 'true',
    bgTimeColorArray: '{{ .Site.Params.indexImg.bgTimeColorArray | jsonify }}',
    descFade: '{{ .Site.Params.indexImg.descFade | default false }}' === 'true',
    desc: '{{ .Site.Params.indexImg.desc | default slice | jsonify }}',
    descFontSize: '{{ .Site.Params.indexImg.descFontSize | default "1.4rem" }}',
    descFadeInTime: Number('{{ .Site.Params.indexImg.descFadeInTime | default 200 }}'),
    descFadeOutTime: Number('{{ .Site.Params.indexImg.descFadeOutTime | default 100 }}'),
    descNextTime: Number('{{ .Site.Params.indexImg.descNextTime | default 800 }}'),
    bubble: '{{ .Site.Params.indexImg.bubble | default false }}' === 'true',
    bubblePosition: Number('{{ .Site.Params.indexImg.bubblePosition | default 0 }}'),
    bubbleNum: Number('{{ .Site.Params.indexImg.bubbleNum | default 200 }}'),
  };

  // 全局变量
  const bannerClass = "banner";
  const bannerArrowClass = "banner-arrow";
  let fadeInInterval = "";
  let fadeOutInterval = "";

  // 页面加载完成后执行
  document.addEventListener('DOMContentLoaded', function() {
    // 创建并添加箭头元素
    initArrow();
    
    // 初始化功能
    if (config.bgTimeColor) {
      bgTimeColorAndTip();
    }
    
    setTimeout(() => {
      noBgBlur();
    }, 100);

    blurText();
    watchScroll();

    if (config.descFade) {
      textFadeInAndOut();
    }
    
    if (config.bubble) {
      initCanvasBubble();
    }
  });

  // 初始化箭头
  function initArrow() {
    // 移除已有箭头
    const oldArrow = document.getElementById(bannerArrowClass);
    if (oldArrow) oldArrow.remove();
    
    // 创建新箭头
    const arrow = document.createElement("a");
    arrow.id = bannerArrowClass;
    arrow.className = bannerArrowClass;
    document.querySelector(`.${bannerClass}`).appendChild(arrow);
    
    // 添加点击事件
    arrow.addEventListener("click", scrollFn);
  }

  // 滚动到banner底部
  function scrollFn() {
    const banner = document.querySelector(`.${bannerClass}`);
    const windowH = banner.clientHeight;
    window.scrollTo({
      top: windowH,
      behavior: "smooth"
    });
  }

  // 监听滚动事件
  function watchScroll() {
    const banner = document.querySelector(`.${bannerClass}`);
    const windowH = banner.clientHeight;
    
    window.addEventListener('scroll', function() {
      if (document.documentElement.scrollTop < windowH) {
        blurText(config.navColor);
        noBgBlur();
      } else {
        if (config.switchNavColor && config.navColor == 1) {
          blurText(2);
        } else if (config.switchNavColor && config.navColor == 2) {
          blurText(1);
        }
        bgBlur();
      }
    });
  }

  function bgBlur() {
    const navbar = document.querySelector(".navbar");
    if (navbar) navbar.classList.remove("navbar1");
  }

  // 导航栏透明
  function noBgBlur() {
    const navbar = document.querySelector(".navbar");
    if (navbar) navbar.classList.add("navbar1");
  }

  // 设置导航栏文字颜色
  function blurText(navColor = config.navColor) {
    const title = document.querySelector(".site-name");
    const nav = document.querySelector(".navbar-nav");
    const navLinks = document.querySelectorAll(".nav-link");
    
    
    if (navColor == 1) {
      if (title) title.classList.remove("site-name1");
      if (nav) nav.classList.remove("navbar1");
      if(navLinks) {
        navLinks.forEach(link => {
          link.classList.remove("nav-link1");
        });
      }
    } else if (navColor == 2) {
      if (title) title.classList.add("site-name1");
      if (nav) nav.classList.add("navbar1");
      if(navLinks) {
        navLinks.forEach(link => {
          link.classList.add("nav-link1");
        });
      }
    }
  }

  // 背景色随时间变化
  function bgTimeColorAndTip() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    
    const div = document.createElement("div");
    div.className = "banner-color";
    
    let bgColor = "";
    let tipContent = "";
    
    if (hours >= 6 && hours < 11) {
      bgColor = config.bgTimeColorArray[0];
      tipContent = `早上好呀~~，现在是 ${hours}:${minutes}:${seconds}，吃早餐了吗？😊🤭`;
    } else if (hours >= 12 && hours <= 16) {
      bgColor = config.bgTimeColorArray[0];
      tipContent = `下午好呀~~，现在是 ${hours}:${minutes}:${seconds}，繁忙的下午也要适当休息哦🥤🏀~~`;
    } else if (hours >= 16 && hours <= 19) {
      bgColor = config.bgTimeColorArray[1];
      tipContent = `到黄昏了~~，现在是 ${hours}:${minutes}:${seconds}，该准备吃饭啦🥗🍖~~`;
    } else if (hours >= 19 && hours < 24) {
      bgColor = config.bgTimeColorArray[2];
      tipContent = `晚上好呀~~，现在是 ${hours}:${minutes}:${seconds}，该准备洗漱睡觉啦🥱😪~~`;
    } else if (hours >= 0 && hours < 6) {
      bgColor = config.bgTimeColorArray[3];
      tipContent = `别再熬夜了~~，现在是 ${hours}:${minutes}:${seconds}，早点睡吧，让我们一起欣赏早上的太阳~~😇🛏`;
    }
    
    div.style.backgroundColor = bgColor;
    document.querySelector(`.${bannerClass}`).parentNode.appendChild(div);
    
    // 添加提示框
    addTip(tipContent, "info");
  }

  // 文字淡入淡出效果
  function textFadeInAndOut() {
    let descElement = document.querySelector(".description");
    
    if (!descElement) {
      const hero = document.querySelector(".hero");
      if (hero) {
        descElement = document.createElement("p");
        descElement.className = "description";
        hero.appendChild(descElement);
      } else {
        return;
      }
    }
    
    descElement.style.fontSize = config.descFontSize;
    
    // 创建光标元素
    const span = document.createElement("span");
    span.className = "typed";
    span.innerHTML = "|";
    
    // 初始化变量
    let index = 0;
    let length = 0;
    let description = descElement.innerText;
    
    // 清空原有内容
    descElement.innerText = "";
    descElement.appendChild(document.createElement("span"));
    descElement.appendChild(span);
    
    // 开始淡入
    fadeInInterval = setInterval(fadeIn, config.descFadeInTime);
    
    // 淡入函数
    function fadeIn() {
      span.style.animation = "none";
      
      // 使用配置的文字数组
      if (Array.isArray(config.desc) && config.desc.length > 0) {
        description = config.desc[length];
      }
      
      descElement.firstChild.innerText = description.substring(0, index++);
      
      // 淡入完成
      if (index > description.length) {
        clearInterval(fadeInInterval);
        span.style.animation = "typedBlink 1s infinite";
        
        setTimeout(() => {
          fadeOutInterval = setInterval(fadeOut, config.descFadeOutTime);
        }, config.descNextTime);
      }
    }
    
    // 淡出函数
    function fadeOut() {
      span.style.animation = "none";
      
      if (index >= 0) {
        descElement.firstChild.innerText = description.substring(0, index--);
      } else {
        clearInterval(fadeOutInterval);
        span.style.animation = "typedBlink 1s infinite";
        
        setTimeout(() => {
          length++;
          if (length >= config.desc.length) {
            length = 0;
          }
          fadeInInterval = setInterval(fadeIn, config.descFadeInTime);
        }, config.descNextTime);
      }
    }
  }

  // 初始化气泡效果
  function initCanvasBubble() {
    const canvas = document.createElement("canvas");
    canvas.id = "canvas";
    canvas.style.top = config.bubblePosition + "%";
    document.querySelector(`.${bannerClass}`).appendChild(canvas);
    
    // 初始化画布大小
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const cxt = canvas.getContext("2d");
    let dots = [];
    
    // 气泡类
    class Dot {
      constructor() {
        this.alive = true;
        this.x = Math.round(Math.random() * canvas.width);
        this.y = Math.round(Math.random() * canvas.height);
        this.diameter = Math.random() * 10.8;
        this.ColorData = {
          Red: Math.round(Math.random() * 255),
          Green: Math.round(Math.random() * 255),
          Blue: Math.round(Math.random() * 255),
        };
        this.alpha = 0.5;
        this.color = `rgba(${this.ColorData.Red}, ${this.ColorData.Green}, ${this.ColorData.Blue}, ${this.alpha})`;
        this.velocity = {
          x: (Math.random() < 0.5 ? -1 : 1) * Math.random() * 0.7,
          y: (Math.random() < 0.5 ? -1 : 1) * Math.random() * 0.7,
        };
      }
      
      draw() {
        cxt.fillStyle = this.color;
        cxt.beginPath();
        cxt.arc(this.x, this.y, this.diameter, 0, Math.PI * 2, false);
        cxt.fill();
      }
      
      update() {
        if (this.alpha < 0.8) {
          this.alpha += 0.01;
          this.color = `rgba(${this.ColorData.Red}, ${this.ColorData.Green}, ${this.ColorData.Blue}, ${this.alpha})`;
        }
        
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        
        // 超出画布则标记为死亡
        if (
          this.x > canvas.width + 5 ||
          this.x < -5 ||
          this.y > canvas.height + 5 ||
          this.y < -5
        ) {
          this.alive = false;
        }
      }
    }
    
    // 初始化气泡
    function initDots() {
      dots = [];
      for (let i = 0; i < config.bubbleNum; i++) {
        dots.push(new Dot());
      }
    }
    
    // 更新和绘制气泡
    function updateDots() {
      // 清理画布
      cxt.clearRect(0, 0, canvas.width, canvas.height);
      
      // 过滤死亡气泡并更新
      dots = dots.filter(dot => dot.alive);
      dots.forEach(dot => {
        dot.update();
        dot.draw();
      });
      
      // 补充新气泡
      while (dots.length < config.bubbleNum) {
        dots.push(new Dot());
      }
      
      requestAnimationFrame(updateDots);
    }
    
    // 窗口大小变化时重置画布
    window.addEventListener('resize', function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initDots();
    });
    
    // 启动气泡动画
    initDots();
    updateDots();
  }

  // 添加提示框（修复选择器错误）
  function addTip(content, type, startHeight = 50, dieTime = 3000) {
    const tips = document.querySelectorAll(".global-tip");
    // 修复：给时间戳添加前缀，避免数字开头的类名
    const time = `tip-${new Date().getTime()}`;
    
    // 计算提示框位置
    let lastTop = startHeight;
    if (tips.length > 0) {
      const lastTip = tips[tips.length - 1];
      const top = parseInt(lastTip.getAttribute("data-top"));
      lastTop = top + lastTip.offsetHeight + 17;
    }
    
    // 创建提示框元素
    const div = document.createElement("div");
    // 修复：使用带前缀的类名
    div.className = `global-tip tip-${type} ${time}`;
    div.style.top = "0px";
    div.setAttribute("data-top", lastTop);
    
    // 设置提示框内容
    let iconClass = "";
    let contentClass = "";
    
    switch(type) {
      case "info":
      case 1:
        iconClass = "icon-info";
        contentClass = "tip-info-content";
        break;
      case "success":
      case 2:
        iconClass = "icon-dagouyouquan";
        contentClass = "tip-success-content";
        break;
      case "danger":
      case 3:
        iconClass = "icon-cuowu";
        contentClass = "tip-danger-content";
        break;
      case "warning":
      case 4:
        iconClass = "icon-gantanhao";
        contentClass = "tip-warning-content";
        break;
    }
    
    div.innerHTML = `<i class="iconfont ${iconClass} icon"></i><p class="${contentClass}">${content}</p>`;
    document.body.appendChild(div);
    
    // 显示提示框（修复：使用正确的选择器）
    const timeTip = document.querySelector(`.${time}`);
    setTimeout(() => {
      timeTip.style.top = lastTop + "px";
      timeTip.style.opacity = "1";
    }, 10);
    
    // 自动关闭提示框
    setTimeout(() => {
      timeTip.style.top = "0px";
      timeTip.style.opacity = "0";
      
      // 调整其他提示框位置
      const allTips = nextAllTipElement(timeTip);
      allTips.forEach(tip => {
        const top = parseInt(tip.getAttribute("data-top")) - tip.offsetHeight - 17;
        tip.setAttribute("data-top", top);
        tip.style.top = top + "px";
      });
      
      // 删除提示框
      setTimeout(() => {
        timeTip.remove();
      }, 500);
    }, dieTime);
  }

  // 获取后续兄弟元素
  function nextAllTipElement(elem) {
    const siblings = [];
    let next = elem.nextSibling;
    
    while (next) {
      if (next.nodeType === 1 && next !== elem) {
        siblings.push(next);
      }
      next = next.nextSibling;
    }
    
    return siblings;
  }
</script>
