<script>
    window.addEventListener('load', function () {
    
      if(window.innerWidth < 992) {
        return;
      }
    
      const today = new Date();
      const year = today.getFullYear();
    
      const solarDay = window.tymeExports.LunarDay.fromYmd(year, 1, 1).getSolarDay();
      const spring = new Date(solarDay.getYear(), solarDay.getMonth() - 1, solarDay.getDay());
    
      const start = new Date(spring.getTime() - 7 * 86400000);
      const end   = new Date(spring.getTime() + 7 * 86400000);
    
      const inRange = today >= start && today <= end;
      if (!inRange) return;
    
      const mei = `<div class="meiha"></div>`;
    
      const deng = `
      <div class="deng-box2">
        <div class="deng">
          <div class="xian"></div>
          <div class="deng-a">
            <div class="deng-b"><div class="deng-t">年</div></div>
          </div>
          <div class="shui shui-a">
            <div class="shui-c"></div><div class="shui-b"></div>
          </div>
        </div>
      </div>
      <div class="deng-box3">
        <div class="deng">
          <div class="xian"></div>
          <div class="deng-a">
            <div class="deng-b"><div class="deng-t">新</div></div>
          </div>
          <div class="shui shui-a">
            <div class="shui-c"></div><div class="shui-b"></div>
          </div>
        </div>
      </div>
      <div class="deng-box1">
        <div class="deng">
          <div class="xian"></div>
          <div class="deng-a">
            <div class="deng-b"><div class="deng-t">乐</div></div>
          </div>
          <div class="shui shui-a">
            <div class="shui-c"></div><div class="shui-b"></div>
          </div>
        </div>
      </div>
      <div class="deng-box">
        <div class="deng">
          <div class="xian"></div>
          <div class="deng-a">
            <div class="deng-b"><div class="deng-t">快</div></div>
          </div>
          <div class="shui shui-a">
            <div class="shui-c"></div><div class="shui-b"></div>
          </div>
        </div>
      </div>
      `;
    
      const style = document.createElement('style');
      style.textContent = `
    .meiha {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 999;
      width: 350px;
      height: 231px;
      pointer-events: none;
    }
    .deng-box {
      position: fixed;
      top: -40px;
      right: 150px;
      z-index: 9999;
      pointer-events: none;
    }
    .deng-box1 {
      position: fixed;
      top: -30px;
      right: 10px;
      z-index: 9999;
      pointer-events: none;
    }
    .deng-box2 {
      position: fixed;
      top: -40px;
      left: 150px;
      z-index: 9999;
      pointer-events: none;
    }
    .deng-box3 {
      position: fixed;
      top: -30px;
      left: 10px;
      z-index: 9999;
      pointer-events: none;
    }
    .deng-box1 .deng,
    .deng-box3 .deng {
      position: relative;
      width: 120px;
      height: 90px;
      margin: 50px;
      background: rgba(216, 0, 15, .8);
      border-radius: 50% 50%;
      transform-origin: 50% -100px;
      animation: swing 5s infinite ease-in-out;
      box-shadow: -5px 5px 30px 4px #fc903d;
    }
    .deng {
      position: relative;
      width: 120px;
      height: 90px;
      margin: 50px;
      background: rgba(216, 0, 15, .8);
      border-radius: 50% 50%;
      transform-origin: 50% -100px;
      animation: swing 3s infinite ease-in-out;
      box-shadow: -5px 5px 50px 4px #fa6c00;
    }
    .deng-a {
      width: 100px;
      height: 90px;
      background: rgba(216, 0, 15, .1);
      margin: 12px 8px 8px 8px;
      border-radius: 50% 50%;
      border: 2px solid #dc8f03;
    }
    .deng-b {
      width: 45px;
      height: 90px;
      background: rgba(216, 0, 15, .1);
      margin: -4px 8px 8px 26px;
      border-radius: 50% 50%;
      border: 2px solid #dc8f03;
    }
    .xian {
      position: absolute;
      top: -20px;
      left: 60px;
      width: 2px;
      height: 20px;
      background: #dc8f03;
    }
    .shui-a {
      position: relative;
      width: 5px;
      height: 20px;
      margin: -5px 0 0 59px;
      animation: swing 4s infinite ease-in-out;
      transform-origin: 50% -45px;
      background: orange;
      border-radius: 0 0 5px 5px;
    }
    .shui-b {
      position: absolute;
      top: 14px;
      left: -2px;
      width: 10px;
      height: 10px;
      background: #dc8f03;
      border-radius: 50%;
    }
    .shui-c {
      position: absolute;
      top: 18px;
      left: -2px;
      width: 10px;
      height: 35px;
      background: orange;
      border-radius: 0 0 0 5px;
    }
    .deng:before {
      position: absolute;
      top: -7px;
      left: 29px;
      height: 12px;
      width: 60px;
      content: " ";
      display: block;
      z-index: 999;
      border-radius: 5px 5px 0 0;
      border: solid 1px #dc8f03;
      background: linear-gradient(to right, #dc8f03, orange, #dc8f03, orange, #dc8f03);
    }
    .deng:after {
      position: absolute;
      bottom: -7px;
      left: 10px;
      height: 12px;
      width: 60px;
      content: " ";
      display: block;
      margin-left: 20px;
      border-radius: 0 0 5px 5px;
      border: solid 1px #dc8f03;
      background: linear-gradient(to right, #dc8f03, orange, #dc8f03, orange, #dc8f03);
    }
    .deng-t {
      font-family: 黑体, sans-serif;
      font-size: 3.2rem;
      color: #dc8f03;
      font-weight: 700;
      line-height: 85px;
      text-align: center;
    }
    @keyframes swing {
      0% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
      100% { transform: rotate(-10deg); }
    }
      `;
    
      document.head.appendChild(style);
      document.body.insertAdjacentHTML('beforeend', mei + deng);
    
      // 鼠标接近灯笼时变透明
      const lanternBoxes = document.querySelectorAll('.deng-box, .deng-box1, .deng-box2, .deng-box3');
      document.addEventListener('mousemove', function(e) {
        lanternBoxes.forEach(function(box) {
          const rect = box.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distance = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
          const maxDistance = 150;
          const opacity = distance < maxDistance ? 0: 1;
          const lantern = box.querySelector('.deng');
          if (lantern) {
           lantern.style.opacity = opacity;
          }
        });
      });
    });
    </script>
